[report]
findings = "Vertebral body heights and alignment are maintained. Bone marrow signal is normal without suspicious lesion. Conus medullaris terminates at L1 and is normal in signal. L2-L3 and L3-L4: mild disc desiccation without significant bulge or canal narrowing. L4-L5: broad-based posterior disc bulge with superimposed left paracentral protrusion contacting and posteriorly displacing the descending left L5 nerve root; moderate left lateral recess narrowing; mild facet arthropathy and ligamentum flavum thickening; spinal canal mildly narrowed (AP diameter 10 mm). L5-S1: small central protrusion without nerve root contact; neural foramina patent. No paraspinal mass. Visualized sacroiliac joints are unremarkable."
impression = "1. Left paracentral disc protrusion at L4-L5 contacting the descending left L5 nerve root, with moderate left lateral recess stenosis - correlates with the clinical radiculopathy. 2. Mild degenerative disc disease at the remaining lumbar levels without high-grade stenosis. 3. No fracture, marrow-replacing lesion, or cord abnormality."
recommendation = "Correlation with symptom severity is advised. If symptoms persist, targeted left L5 transforaminal epidural steroid injection may be considered; surgical consultation if progressive neurologic deficit develops."

