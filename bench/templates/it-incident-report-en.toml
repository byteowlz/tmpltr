title = "API gateway outage due to certificate expiry in edge fleet"
start = "2026-07-08 03:12 UTC"
detected = "2026-07-08 03:19 UTC"
resolved = "2026-07-08 05:47 UTC"
duration_min = 155
customer_impact = "Approximately 62% of API requests failed with TLS handshake errors for 2h 35m. Webhook deliveries were queued and replayed after recovery; no data was lost. 41 enterprise customers were affected, 18 support tickets were opened."
affected_services = ["Public REST API", "Webhooks delivery", "Dashboard login", "Mobile sync"]

